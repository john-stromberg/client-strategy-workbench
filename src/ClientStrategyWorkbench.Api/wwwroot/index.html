<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Strategy Workbench</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 24px; }
    h1 { margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(280px, 1fr)); gap: 12px; }
    label { display: block; font-size: 12px; color: #444; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 14px; }
    pre { background: #111; color: #eee; padding: 12px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Client Strategy Workbench</h1>
  <p>Workflow-first strategy packet generator with Office deliverable references.</p>

  <div class="grid">
    <div>
      <label>Household Name</label>
      <input id="householdName" value="Anderson Family" />
    </div>
    <div>
      <label>Advisor Name</label>
      <input id="advisorName" value="Advisor A" />
    </div>
    <div>
      <label>Client Email</label>
      <input id="clientEmail" value="client@example.com" />
    </div>
    <div>
      <label>Primary Goal</label>
      <input id="primaryGoal" value="Retirement income stability" />
    </div>
    <div>
      <label>Risk Tolerance</label>
      <select id="riskTolerance">
        <option>Conservative</option>
        <option selected>Moderate</option>
        <option>Growth</option>
        <option>Aggressive</option>
      </select>
    </div>
    <div>
      <label>Tax Sensitivity</label>
      <select id="taxSensitivity">
        <option>Low</option>
        <option selected>Medium</option>
        <option>High</option>
      </select>
    </div>
  </div>

  <button id="generateBtn">Generate Strategy</button>

  <h3>Result</h3>
  <pre id="output">Waiting...</pre>

  <script>
    document.getElementById('generateBtn').addEventListener('click', async () => {
      const payload = {
        advisorName: document.getElementById('advisorName').value,
        clientEmail: document.getElementById('clientEmail').value,
        household: {
          householdName: document.getElementById('householdName').value,
          primaryGoal: document.getElementById('primaryGoal').value,
          timeHorizonYears: 12,
          riskTolerance: document.getElementById('riskTolerance').value,
          liquidityReserveMonths: 4,
          annualIncome: 420000,
          annualSpending: 360000,
          investableAssets: 3800000,
          liabilities: 900000
        },
        constraints: {
          maxEquityPercent: 80,
          minFixedIncomePercent: 20,
          concentrationLimitPercent: 15,
          restrictedHoldings: "Private Placement A",
          taxSensitivity: document.getElementById('taxSensitivity').value
        }
      };

      const res = await fetch('/api/strategy/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      document.getElementById('output').textContent = JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>
